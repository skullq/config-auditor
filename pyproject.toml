[project]
name = "config-auditor"
version = "0.1.0"
description = "Network Configuration Auditor using FastAPI, cisco-config-parser, and Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "pydantic",
    "cisco-config-parser==3.0.0",
    "playwright>=1.63.0",
]

[tool.uv]
managed = true
package = false

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
